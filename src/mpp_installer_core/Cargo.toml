[package]
name = "mpp_installer_core"
version = "0.0.0"
authors = ["Rimi Kanokawa <rimi@rimin.moe>"]
edition = "2024"
publish = false

[features]

[dependencies]
rkyv = { version = "0.8", features = ["aligned", "little_endian", "pointer_width_32"] }
memmap2 = "0.9.12"
zstd = { version = "0.14", default-features = false, features = ["vendored", "zdict_builder"] }

errcode = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }

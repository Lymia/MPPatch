[metadata]
game = "civ5"
platform = "linux"
steam_id = 8930
assets_path = "steamassets/assets"

check_for = ["Civ5XP", "steamclient.so", "libCvGameCoreDLL.so"]
hash_from = "Civ5XP"
supported_hashes = [
  "cc06b647821ec5e7cca3c397f6b0d4726f0106cdd67bcf074d494bea2607a8ca",
]

[packages.core]
rename_file = [
  { from = "Civ5XP", to = "Civ5XP.orig" },
]
write_file = [
  { from = "Civ5XP.sh", to = "Civ5XP", exec = true },
  { from = "Civ5XP.launch.sh", to = "Civ5XP.launch", exec = true },
  { from = "Civ5XP.launch.helper.sh", to = "Civ5XP.launch.helper" },
  { from = "native/mpp_hooklib.so", to = "mpp_hooklib.so", exec = true },
]
write_config = [
  "mppatch_config.cfg",
]

[packages.multiplayer]
depends = ["core"]
write_dlc = [
  { from = "ui/mppatch.xml", to = "dlc/mppatch", text_data = "gameplay/xml/newtext/mppatch_textdata" },
]
enable_feature = ["Multiplayer"]

[packages.luajit]
depends = ["core"]
write_file = [
  { from = "native/luajit_linux.so", to = "mppatch_luajit.so" },
]
enable_feature = ["LuaJit"]

[packages.logging]
enable_feature = ["Logging"]

[packages.debug]
enable_feature = ["Debug"]

[cleanup]
renames = [
  { from = "Civ5XP.orig", to = "Civ5XP" },
]
check_file = [
  "Civ5XP.launch",
  "Civ5XP.orig",
  "mpp_hooklib.so",
  "mppatch_luajit.so",
  "mppatch_config.ini",
  "steamassets/assets/dlc/mppatch",
  "steamassets/assets/gameplay/xml/newtext/mppatch_textdata",
]

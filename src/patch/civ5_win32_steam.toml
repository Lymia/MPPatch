[metadata]
game = "civ5"
platform = "win32"
steam_id = 8930
assets_path = "Assets"

check_for = ["CivilizationV.exe", "CvGameDatabaseWin32Final Release.dll", "steam_api.dll"]
hash_from = "CvGameDatabaseWin32Final Release.dll"
supported_hashes = [
  "f95637398ce10012c785b0dc952686db82613f702a8511bbc7ac822896949563",
]

[packages.multiplayer]
rename_file = [
  { from = "zlib1.dll", to = "zlib1.dll.bak" },
]
write_file = [
  { from = "native/mpp_hooklib.dll", to = "zlib1.dll" },
]
write_config = [
  "mppatch_config.cfg",
]
write_dlc = [
  { from = "ui/mppatch.xml", to = "DLC/MPPatch", text_data = "Gameplay/XML/NewText/MPPatch_TextData" },
]
enable_feature = ["Multiplayer"]

[packages.luajit]
rename_file = [
  { from = "lua51_Win32.dll", to = "lua51_Win32.dll.bak" },
]
write_file = [
  { from = "native/luajit_win32.dll", to = "lua51_Win32.dll" },
]
enable_feature = ["LuaJit"]

[packages.logging]
enable_feature = ["Logging"]

[packages.debug]
enable_feature = ["Debug"]

[cleanup]
renames = [
  { from = "zlib1.dll.bak", to = "zlib1.dll" },
  { from = "lua51_Win32.dll.bak", to = "lua51_Win32.dll" },
]
check_file = [
  "lua51_Win32.dll.bak",
  "zlib1.dll.bak",
  "mppatch_config.ini",
  "steamassets/assets/DLC/MPPatch",
  "steamassets/assets/Gameplay/XML/NewText/MPPatch_TextData",
]

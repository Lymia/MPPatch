game = "civ5"
gameType = "steam"
platform = "win32"
steamId = 8930
assetsPath = "Assets"

checkFor = ["CivilizationV.exe", "CvGameDatabaseWin32Final Release.dll", "steam_api.dll"]
hashFrom = "CvGameDatabaseWin32Final Release.dll"
supportedHashes = { "f95637398ce10012c785b0dc952686db82613f702a8511bbc7ac822896949563" = "1.0.3.279" }

[packages.multiplayer]
renameFile = [
  { from = "zlib1.dll", to = "zlib1.dll.bak" },
]
writeFile = [
  { from = "native/mpp_hooklib.dll", to = "zlib1.dll" },
]
writeConfig = [
  "mppatch_config.cfg",
]
writeDlc = [
  { from = "ui/mppatch.xml", to = "DLC/MPPatch", textData = "Gameplay/XML/NewText/MPPatch_TextData" },
]
enableFeature = ["Multiplayer"]

[packages.luajit]
renameFile = [
  { from = "lua51_Win32.dll", to = "lua51_Win32.dll.bak" },
]
writeFile = [
  { from = "native/luajit_win32.dll", to = "lua51_Win32.dll" },
]
enableFeature = ["LuaJit"]

[packages.logging]
enableFeature = ["Logging"]

[packages.debug]
enableFeature = ["Debug"]

[cleanup]
renames = [
  { from = "zlib1.dll.bak", to = "zlib1.dll" },
  { from = "lua51_Win32.dll.bak", to = "lua51_Win32.dll" },
]
checkFile = [
  "lua51_Win32.dll.bak",
  "zlib1.dll.bak",
  "mppatch_config.ini",
  "steamassets/assets/DLC/MPPatch",
  "steamassets/assets/Gameplay/XML/NewText/MPPatch_TextData",
]

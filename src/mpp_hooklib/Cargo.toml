[package]
name = "mpp_hooklib"
version = "0.0.0"
authors = ["Rimi Kanokawa <rimi@rimin.moe>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
dlopen = "0.1"
enumset = "1.1"
errcode = { version = "0.1", features = ["repr_full"] }
libc = "0.2"
linktime = "0.19"
log = { version = "0.4", features = ["std"] }
mlua = { version = "0.12", features = ["lua51", "module", "error-send"] }
simplelog = { version = "0.12", features = ["paris"] }

mpp_common = { workspace = true }

[target.'cfg(windows)'.dependencies]
pe-parser = "0.7.0"
sha2 = "0.11.1"
winapi = { version = "0.3", features = ["memoryapi", "libloaderapi", "errhandlingapi", "std"] }

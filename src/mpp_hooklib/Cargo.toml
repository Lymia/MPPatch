[package]
name = "mpp_hooklib"
version = "0.2.0-alpha.2"
authors = ["Rimi Kanokawa <rimi@rimin.moe>"]
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dlopen = "0.1"
enumset = "1.1"
errcode = { workspace = true }
libc = { workspace = true }
linktime = "0.19"
log = { version = "0.4", features = ["std"] }
mlua = { version = "0.12", features = ["lua51", "module"] }

mpp_common = { workspace = true }
mpp_defs = { workspace = true }
mpp_version = { workspace = true }

[target.'cfg(windows)'.dependencies]
pe-parser = "0.7.0"
sha2 = "0.11.1"
winapi = { version = "0.3", features = ["memoryapi", "libloaderapi", "errhandlingapi", "std"] }
libz-rs-sys = { version = "0.6.8", default-features = false, features = ["c-allocator", "std", "export-symbols"] }

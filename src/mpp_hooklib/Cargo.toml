[package]
name = "mpp_hooklib"
version = "0.0.0"
authors = ["Lymia Kanokawa <lymia@lymia.moe>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
dlopen = "0.1"
enumset = { version = "1.1", features = ["serde"] }
errcode = { version = "0.1", features = ["repr_full"] }
libc = "0.2"
linktime = "0.19"
log = { version = "0.4", features = ["std"] }
mlua = { version = "0.12", features = ["lua51", "module", "error-send"] }
serde = { version = "1.0", features = ["derive"] }
simplelog = { version = "0.12", features = ["paris"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

[target.'cfg(windows)'.dependencies]
pe-parser = "0.7.0"
sha2 = "0.11.1"
winapi = { version = "0.3", features = ["memoryapi", "libloaderapi", "std"] }

cargo-features = ["panic-immediate-abort"]

[workspace]
resolver = "3"
members = [
    "src/mpp_common",
    "src/mpp_hooklib",
]

[profile.dev]
opt-level = "s"
lto = true
debug = "line-tables-only"
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
debug = "none"
panic = "immediate-abort"

[workspace.dependencies]
mpp_common = { version = "*", path = "src/mpp_common" }
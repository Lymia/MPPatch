cargo-features = ["panic-immediate-abort"]

[workspace]
resolver = "3"
members = [
    "src/mpp_common",
    "src/mpp_defs",
    "src/mpp_hooklib",
    "src/mpp_version",
]

[profile.dev]
opt-level = "s"
lto = true
debug = "line-tables-only"
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
debug = "none"
panic = "abort"

[workspace.dependencies]
errcode = { version = "0.1", features = ["repr_full"] }
libc = "0.2"

mpp_common = { version = "*", path = "src/mpp_common" }
mpp_defs = { version = "*", path = "src/mpp_defs" }
mpp_version = { version = "*", path = "src/mpp_version" }
